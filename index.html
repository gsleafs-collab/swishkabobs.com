<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swish Kabobs | Coming Soon</title>
<meta name="description" content="Swish Kabobs. Dropping leaves and draining threes. Coming soon.">
<meta name="theme-color" content="#c4520f">
<meta property="og:title" content="Swish Kabobs">
<meta property="og:description" content="Dropping Leaves & Draining Threes. Coming soon.">
<meta property="og:image" content="https://swishkabobs.com/poster.jpg">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" as="font" href="yellowtail.woff2" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Yellowtail";
    src: url("yellowtail.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  :root {
    --gold: #f7c45a;
    --ink: #1c1206;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #b5480e;
  }

  /* The artwork, extended outward, sized to cover any screen.
     Laptops and wide screens get the wide version, phones the tall one. */
  .scene {
    --ar: 2690 / 1454;
    --px: 28.2528%; --py: 0%; --pw: 43.4944%; --ph: 100%;
    position: fixed;
    left: 50%;
    top: 50%;
    width: max(100vw, calc(100dvh * 2690 / 1454));
    aspect-ratio: var(--ar);
    translate: -50% -50%;
    animation: rise 1.4s cubic-bezier(.2,.7,.2,1) both;
  }
  @media (max-aspect-ratio: 79/100) {
    .scene {
      --ar: 1170 / 2574;
      --px: 0%; --py: 21.7560%; --pw: 100%; --ph: 56.4880%;
      width: max(100vw, calc(100dvh * 1170 / 2574));
    }
  }
  .scene picture, .scene img {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Box that lines up exactly with the original poster inside the artwork */
  .poster {
    position: absolute;
    left: var(--px);
    top: var(--py);
    width: var(--pw);
    height: var(--ph);
    container-type: inline-size;
  }

  /* "Coming Soon" set where the season dates used to be */
  .soon {
    position: absolute;
    right: 4.5cqw;
    bottom: 5.5cqw;
    margin: 0;
    font-family: "Yellowtail", cursive;
    font-weight: 400;
    font-size: 13.5cqw;
    line-height: 1;
    color: var(--gold);
    -webkit-text-stroke: .55cqw var(--ink);
    paint-order: stroke fill;
    text-shadow: .45cqw .45cqw 0 var(--ink), .9cqw .9cqw 1.2cqw rgba(0,0,0,.35);
    letter-spacing: .02em;
    white-space: nowrap;
    transform-origin: 80% 70%;
    animation: pop 1.1s 1s cubic-bezier(.2,1.4,.4,1) both, bob 4s 2.2s ease-in-out infinite;
  }

  #leaves {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(30%) rotate(-6deg) scale(.7); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes bob {
    0%, 100% { transform: rotate(0) translateY(0); }
    50%      { transform: rotate(-1.5deg) translateY(-1.2cqw); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scene, .soon { animation: none; }
  }
</style>
</head>
<body>
  <main class="scene">
    <picture>
      <source media="(max-aspect-ratio: 79/100)" srcset="poster-tall.webp" type="image/webp">
      <source media="(max-aspect-ratio: 79/100)" srcset="poster-tall.jpg">
      <source srcset="poster-wide.webp" type="image/webp">
      <img src="poster-wide.jpg" alt="Swish Kabobs fall poster: Dropping Leaves and Draining Threes, under an autumn maple tree with the CN Tower behind">
    </picture>
    <div class="poster">
      <h1 class="soon">Coming Soon...</h1>
    </div>
  </main>
  <canvas id="leaves" aria-hidden="true"></canvas>

<script>
(() => {
  const canvas = document.getElementById('leaves');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Colours sampled from the poster's maple leaves
  const palette = [
    ['#e8590c', '#9a3208'], ['#f08c00', '#a65a05'], ['#d9480f', '#7f2a07'],
    ['#f5a524', '#a8680c'], ['#c7361b', '#6e1c0c'], ['#f2b632', '#9c6d0e'],
    ['#e2701b', '#8c3b08']
  ];

  // Maple leaf outline, drawn in a 100x100 box centred on 0,0
  const leafPath = new Path2D(
    'M0,-48 L7,-30 L15,-36 L13,-14 L30,-28 L27,-20 L44,-22 L36,-8 L46,-4 L26,10 ' +
    'L31,20 L10,16 L4,22 L3,46 L-3,46 L-4,22 L-10,16 L-31,20 L-26,10 L-46,-4 ' +
    'L-36,-8 L-44,-22 L-27,-20 L-30,-28 L-13,-14 L-15,-36 L-7,-30 Z'
  );
  const veins = new Path2D(
    'M0,40 L0,-40 M0,8 L28,-20 M0,8 L-28,-20 M0,18 L22,14 M0,18 L-22,14'
  );

  let W, H, dpr, leaves = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const target = reduce ? 0 : Math.round(Math.min(70, Math.max(26, (W * H) / 17000)));
    while (leaves.length < target) leaves.push(makeLeaf(true));
    leaves.length = target;
  }

  function makeLeaf(anywhere) {
    const depth = Math.random();            // 0 = far, 1 = near
    const size = 16 + depth * 30;
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -size * 2,
      size,
      depth,
      fall: 0.35 + depth * 0.9 + Math.random() * 0.3,
      swayAmp: 18 + Math.random() * 40,
      swayFreq: 0.004 + Math.random() * 0.006,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.04,
      flip: Math.random() * Math.PI * 2,
      flipSpeed: 0.01 + Math.random() * 0.03,
      colors: palette[(Math.random() * palette.length) | 0],
      baseX: 0
    };
  }

  let wind = 0, t = 0;
  function frame() {
    t++;
    wind = Math.sin(t * 0.0015) * 0.6 + Math.sin(t * 0.0041) * 0.3;
    ctx.clearRect(0, 0, W, H);
    leaves.sort((a, b) => a.depth - b.depth);
    for (const l of leaves) {
      l.y += l.fall;
      l.phase += l.swayFreq * 6;
      l.baseX += wind * (0.4 + l.depth);
      l.rot += l.spin + Math.sin(l.phase) * 0.01;
      l.flip += l.flipSpeed;
      const x = l.x + l.baseX + Math.sin(l.phase) * l.swayAmp;

      if (l.y > H + l.size * 2 || x < -120 || x > W + 120) {
        Object.assign(l, makeLeaf(false));
        l.x = Math.random() * (W + 200) - 100;
        continue;
      }

      const s = l.size / 100;
      const flipX = Math.cos(l.flip);        // fake 3D tumble
      ctx.save();
      ctx.translate(x, l.y);
      ctx.rotate(l.rot);
      ctx.scale(s * (0.25 + 0.75 * Math.abs(flipX)), s);
      ctx.globalAlpha = 0.75 + l.depth * 0.25;
      ctx.fillStyle = flipX > 0 ? l.colors[0] : l.colors[1];
      ctx.fill(leafPath);
      ctx.lineJoin = 'round';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(70, 25, 5, .75)';
      ctx.stroke(leafPath);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(80, 30, 5, .55)';
      ctx.stroke(veins);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
